name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (php ${{ matrix.php }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Supply-chain tradeoff, deliberate: this pins a MOVING branch of the
      # core engine (master), not an immutable ref, because the published
      # ^4.1.0 floor no longer resolves from Packagist (the v4.1.0 tag was
      # yanked). The path repository plus the update step below only float
      # within that constraint.
      - name: Checkout guard-core-php (path repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rennf93/guard-core-php
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-php at the path repository location
        run: mv core-checkout ../guard-core-php

      # v4.1.0 was yanked, so the engine VCS repo entry would make composer
      # eagerly clone github (anonymous API auth hard-fails) and the path
      # repository has no version a detached checkout can infer. CI-only
      # patch on the runner: stamp a version onto the engine checkout's
      # composer.json and drop the engine VCS repo entry. Published files
      # are untouched.
      - name: Resolve guard-core-php from the path repository (CI-only patch)
        run: |
          python3 - <<'EOF'
          import json

          engine = "../guard-core-php/composer.json"
          with open(engine) as f:
              d = json.load(f)
          d["version"] = "4.2.99"
          with open(engine, "w") as f:
              json.dump(d, f, indent=4)
              f.write("\n")

          with open("composer.json") as f:
              d = json.load(f)
          d["repositories"] = [
              repo
              for repo in d.get("repositories", [])
              if not (
                  repo.get("type") == "vcs"
                  and "guard-core-php" in repo.get("url", "")
              )
          ]
          with open("composer.json", "w") as f:
              json.dump(d, f, indent=4)
              f.write("\n")
          EOF

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress
          composer update rennf93/guard-core-php --no-interaction

      - name: php -l sweep
        run: for f in $(find src bin -name '*.php'); do php -l "$f" > /dev/null || exit 1; done && echo LINT_OK

      - name: test_laravel
        env:
          REDIS_HOST: 127.0.0.1
        run: php bin/test_laravel.php

  composer-audit:
    name: Composer audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Checkout guard-core-php (path repository)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rennf93/guard-core-php
          ref: master
          path: core-checkout
          persist-credentials: false

      - name: Place guard-core-php at the path repository location
        run: mv core-checkout ../guard-core-php

      - name: Resolve guard-core-php from the path repository (CI-only patch)
        run: |
          python3 - <<'EOF'
          import json

          engine = "../guard-core-php/composer.json"
          with open(engine) as f:
              d = json.load(f)
          d["version"] = "4.2.99"
          with open(engine, "w") as f:
              json.dump(d, f, indent=4)
              f.write("\n")

          with open("composer.json") as f:
              d = json.load(f)
          d["repositories"] = [
              repo
              for repo in d.get("repositories", [])
              if not (
                  repo.get("type") == "vcs"
                  and "guard-core-php" in repo.get("url", "")
              )
          ]
          with open("composer.json", "w") as f:
              json.dump(d, f, indent=4)
              f.write("\n")
          EOF

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: |
          composer install --no-interaction --no-progress
          composer update rennf93/guard-core-php --no-interaction

      - name: Composer audit
        run: composer audit
